name: fetch_daily

on:
  schedule:
    # Primary run: 12:25 AM ET (EDT). Later runs are safety-net retries —
    # the script exits immediately if the day's file already exists, and
    # refuses to write a mislabeled file if the portal has already rolled
    # over to the next day's snapshot.
    - cron: "25 4 * * *"
    - cron: "25 7 * * *"
    - cron: "25 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ./bin/requirements.txt
    - name: Fetch today's file
      run: python ./bin/fetch_dic.py
    - name: Commit and push
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ./dat/via_github/
        if git diff --cached --quiet; then
          echo "No new file to commit."
          exit 0
        fi
        git commit -m "Add DIC file for $(date -d yesterday +%Y-%m-%d)"
        # Retry the push in case another run or a manual commit landed in between.
        for i in 1 2 3; do
          if git push origin HEAD:${{ github.ref_name }}; then
            exit 0
          fi
          git pull --rebase origin ${{ github.ref_name }}
          sleep 5
        done
        git push origin HEAD:${{ github.ref_name }}
